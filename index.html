<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>生日快乐，我最爱的人</title>
<meta property="og:title" content="生日快乐，我最爱的人">
<meta property="og:description" content="从二〇一四年到今天，一年一张，都是我们。">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#7a4d5a; --rose:#c07f8f; --gold:#d4a07a; --soft:#a8818b;
  --paper:#fffdf8; --card:#fffdfa;
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--serif);color:var(--ink);background:#fdeaec;-webkit-font-smoothing:antialiased}

/* 滚动容器：强制整屏翻页 */
.deck{position:fixed;inset:0;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.page{position:relative;width:100%;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 7vw;isolation:isolate}
.page{background:linear-gradient(165deg,#fff8f5 0%,#fdeaec 48%,#f8dce4 100%)}
.page:nth-child(even){background:linear-gradient(165deg,#fff8f5 0%,#fce8ec 50%,#f7dbe4 100%)}

/* 背景光斑 + 花瓣 */
.bg{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(2px)}
.g1{width:70vw;height:70vw;max-width:360px;max-height:360px;top:-18%;right:-22%;background:radial-gradient(circle,rgba(255,214,170,.5),transparent 70%);animation:float1 14s ease-in-out infinite}
.g2{width:66vw;height:66vw;max-width:330px;max-height:330px;bottom:-20%;left:-24%;background:radial-gradient(circle,rgba(240,170,190,.42),transparent 70%);animation:float2 17s ease-in-out infinite}
.g3{width:46vw;height:46vw;max-width:230px;max-height:230px;top:44%;left:34%;background:radial-gradient(circle,rgba(255,232,200,.38),transparent 72%);animation:float1 20s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(4%,5%)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5%,-4%)}}
.petal{position:absolute;top:-6%;border-radius:50% 50% 50% 0;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}8%{opacity:.7}92%{opacity:.55}100%{transform:translate3d(var(--dx,30px),112vh,0) rotate(var(--rot,320deg));opacity:0}}

/* ===== 入场动画：每页各不相同 ===== */
.anim{opacity:0;transform:translateY(22px);transition:opacity .75s ease var(--d,0s),transform .75s ease var(--d,0s)}
.page.in .anim{opacity:1;transform:var(--r,none)}
.anim.pop{transform:translateY(22px) scale(.94)}
.page.in .anim.pop{transform:var(--r,none)}

/* 入场关键帧：终态回到各自的 --r（保留照片原本的倾斜） */
@keyframes eFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:var(--r,none)}}
@keyframes eUp{from{opacity:0;transform:translateY(70px) scale(.92)}to{opacity:1;transform:var(--r,none)}}
@keyframes eDown{from{opacity:0;transform:translateY(-60px) scale(.93)}to{opacity:1;transform:var(--r,none)}}
@keyframes eLeft{from{opacity:0;transform:translateX(-70px) rotate(-9deg) scale(.94)}to{opacity:1;transform:var(--r,none)}}
@keyframes eRight{from{opacity:0;transform:translateX(70px) rotate(9deg) scale(.94)}to{opacity:1;transform:var(--r,none)}}
@keyframes eCorner{from{opacity:0;transform:translate(55px,55px) rotate(8deg) scale(.9)}to{opacity:1;transform:var(--r,none)}}
@keyframes eFlip{from{opacity:0;transform:perspective(700px) rotateY(-42deg) scale(.9)}to{opacity:1;transform:var(--r,none)}}
@keyframes eRise{0%{opacity:0;transform:translateY(80px) scale(.88)}70%{opacity:1;transform:translateY(-8px) scale(1.02)}100%{opacity:1;transform:var(--r,none)}}
@keyframes eCard{from{opacity:0;transform:translateY(-55px) scale(.9)}to{opacity:1;transform:var(--r,none)}}
@keyframes ePop{0%{opacity:0;transform:scale(.55) var(--r,)}60%{opacity:1;transform:scale(1.06) var(--r,)}100%{opacity:1;transform:scale(1) var(--r,)}}
@keyframes eStamp{0%{opacity:0;transform:scale(1.9) rotate(-22deg)}55%{opacity:1;transform:scale(.9) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes ePaper{from{opacity:0;transform:perspective(800px) rotateX(-40deg) translateY(-26px);transform-origin:top center}to{opacity:1;transform:rotate(-.8deg);transform-origin:top center}}
@keyframes yrDrop{from{opacity:0;transform:translateY(-34px);letter-spacing:.3em}to{opacity:1;transform:none;letter-spacing:.04em}}
@keyframes yrSlide{from{opacity:0;transform:translateX(-45px)}to{opacity:1;transform:none}}
@keyframes yrZoom{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes capUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes loveIn{from{opacity:0;transform:translateY(9px)}to{opacity:.62;transform:none}}
.page.in .love{animation:loveIn 1.3s ease var(--d,0s) both}

/* 进入当前页时，按各自变量播放不同动画 */
.page.in .anim[style*="--pic"]{animation:var(--pic) 1.05s cubic-bezier(.2,.72,.22,1) .12s both}
.page.in .anim[style*="--yr"]{animation:var(--yr) 1s cubic-bezier(.2,.72,.22,1) .05s both}
/* 同一页多张照片，依次错开进入 */
.duo .card.b{animation-delay:.3s!important}
.grid3 .card:nth-child(2){animation-delay:.28s!important}
.grid3 .card:nth-child(3){animation-delay:.44s!important}

/* 封面：标题抬起、3D 旋转的双环徽章 */
.pg1 h1{animation:eUp 1.15s cubic-bezier(.2,.72,.22,1) .3s both}
.pg1 .who{animation:capUp 1s ease .5s both}
.pg1 .ico{animation:ePop 1s cubic-bezier(.2,.72,.22,1) .2s both,heartbeat 3.2s ease-in-out 1.4s infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.08)}24%{transform:scale(1)}36%{transform:scale(1.05)}}
.cover-3d{perspective:500px}
.cover-3d .ring{transform-style:preserve-3d;animation:ringTurn 12s linear infinite}
@keyframes ringTurn{0%{transform:rotateY(0) rotateX(8deg)}50%{transform:rotateY(180deg) rotateX(-8deg)}100%{transform:rotateY(360deg) rotateX(8deg)}}

/* 信：信纸翻开 */
.pg15 .head{animation:capUp .9s ease .12s both}
.pg15 .paper{animation:ePaper 1.25s cubic-bezier(.22,.7,.24,1) .3s both}
/* 结尾：封蜡盖章 + 文字浮现 */
.pg16 .seal{animation:eStamp 1.1s cubic-bezier(.2,.8,.3,1) .18s both}
.pg16 h2{animation:eUp 1s ease .5s both}
.pg16 .wish{animation:capUp 1s ease .68s both}
.pg16 .sm{animation:eFade 1s ease .9s both}

/* 照片 3D 悬浮：入场后极轻微的立体摆动，不挡内容 */
.yearpg .photo{transform-style:preserve-3d;animation:photoHover 9s ease-in-out 2s infinite}
@keyframes photoHover{0%,100%{transform:perspective(700px) rotateY(-2.2deg) rotateX(1deg)}50%{transform:perspective(700px) rotateY(2.2deg) rotateX(-1deg)}}

/* canvas 光尘渲染层：浮在最上层，不挡触摸 */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* 顶部进度条 + 页码 + 音乐 + 导航点 */
.progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--rose));z-index:50;width:0;transition:width .15s linear}
.counter{position:fixed;top:calc(14px + env(safe-area-inset-top));right:18px;z-index:50;font:400 11px Georgia,serif;letter-spacing:.1em;color:var(--soft)}
.music-btn{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:60;width:34px;height:34px;border-radius:50%;border:1px solid rgba(212,160,122,.55);background:rgba(255,253,248,.7);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.music-btn svg{width:17px;height:17px;fill:var(--rose);transition:transform .3s}
.music-btn.playing svg{animation:spin 3.5s linear infinite}
.music-btn.tip{animation:pulse 1.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,127,143,.4)}50%{box-shadow:0 0 0 9px rgba(192,127,143,0)}}
.dots{position:fixed;right:9px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:rgba(192,127,143,.32);transition:.35s;cursor:pointer}
.dots i.on{background:var(--rose);transform:scale(1.6)}

/* 通用文字 */
.en{font:400 9px Georgia,serif;letter-spacing:.34em;color:var(--gold);padding-left:.34em}
.d{font:400 11px Georgia,serif;letter-spacing:.2em;color:var(--gold);padding-left:.2em}
.ttl{font:400 clamp(22px,6.4vw,28px)/1.4 var(--serif);letter-spacing:.1em;color:var(--ink);padding-left:.1em}
.sub{font-size:clamp(11px,3vw,13px);color:var(--soft);margin-top:10px;letter-spacing:.04em}
.yr{font-family:Georgia,serif;color:transparent;-webkit-text-stroke:1px rgba(212,160,122,.5);letter-spacing:.04em}

/* 每页不同语言的「我爱你」，散落在边角，不挡主体 */
.love{position:absolute;font:400 clamp(10px,2.6vw,13px)/1.5 var(--serif);color:var(--gold);opacity:.62;letter-spacing:.12em;pointer-events:none;z-index:0;white-space:nowrap;text-shadow:0 1px 3px rgba(255,250,245,.6)}
.lp1{left:5vw;top:12vh}.lp2{right:5vw;top:12vh}.lp3{left:6vw;bottom:8vh}.lp4{right:5vw;bottom:10vh}
.lp5{left:3vw;top:36vh}.lp6{right:5vw;top:32vh}.lp12{right:5vw;top:40vh}.lp14{left:4vw;top:38vh}
.lp5,.lp6,.lp12,.lp14{writing-mode:vertical-rl;letter-spacing:.2em}
.lp7{left:0;right:0;top:7vh;text-align:center}.lp8{left:0;right:0;bottom:6vh;text-align:center}.lp13{left:0;right:0;top:10vh;text-align:center}
.lp9{left:5vw;top:25vh}.lp10{right:5vw;bottom:24vh}.lp11{left:6vw;bottom:27vh}.lp15{left:7vw;bottom:6vh}.lp16{right:6vw;bottom:7vh}

/* 照片槽位 */
.photo{position:relative;overflow:hidden;background:#f3e2e2;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.photo img.loaded{opacity:1}
.card{background:var(--card);padding:6px 6px 18px;box-shadow:0 10px 24px rgba(150,100,120,.2)}

/* 封面 */
.cover h1{font:400 clamp(32px,9vw,42px)/1.4 var(--serif);letter-spacing:.06em;color:var(--ink);padding-left:.06em;white-space:nowrap}
.cover .who{font:400 clamp(21px,6vw,26px) var(--serif);letter-spacing:.18em;color:var(--rose);margin-top:12px;padding-left:.18em;white-space:nowrap}
.cover .ico{margin:22px 0 16px}
.cover .date{margin-top:44px;font:400 12px Georgia,serif;letter-spacing:.3em;color:#b08a92;padding-left:.3em}
.hint{margin-top:30px;text-align:center;font-size:10px;letter-spacing:.2em;color:#c0a0a8}
.hint i{display:block;width:1px;height:24px;margin:9px auto 0;background:linear-gradient(var(--gold),transparent);animation:hintmove 1.8s ease-in-out infinite}
@keyframes hintmove{0%,100%{opacity:.3;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1)}}

/* 年份页：三种版式，按照片数量选 */
.yearpg .yr{font-size:clamp(50px,15vw,70px);margin-bottom:1vh}
.yearpg .cap{text-align:center;margin-top:3.2vh;min-height:9vh}
.yearpg .cap .ttl{margin-top:8px}
/* 1 张 */
.y1 .solo{--r:rotate(-1.5deg);width:min(66vw,280px);height:52vh;max-height:430px;min-height:280px;border:6px solid var(--card);box-shadow:0 14px 30px rgba(150,100,120,.22)}
/* 2 张 */
.y2 .duo{position:relative;width:min(88vw,360px);height:46vh;max-height:390px;min-height:260px}
.y2 .duo .card{position:absolute;box-shadow:0 10px 24px rgba(150,100,120,.2)}
.y2 .duo .a{--r:rotate(-4deg);left:2%;top:0;width:52%;height:88%}
.y2 .duo .b{--r:rotate(5deg);right:2%;bottom:0;width:50%;height:78%}
.y2 .duo .card .photo{height:100%}
/* 3 张 */
.y3 .grid3{width:min(88vw,360px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.3fr 1fr;gap:8px;margin-top:1vh}
.y3 .grid3 .big{grid-column:1/3}
.y3 .grid3 .card .photo{height:clamp(90px,17vh,140px)}
.y3 .grid3 .card.big .photo{height:clamp(130px,26vh,220px)}

/* 信 */
.letter{padding:5vh 6vw}
.letter .head{text-align:center;margin-bottom:1.8vh}
.letter .head h2{font:400 clamp(20px,5.6vw,25px) var(--serif);letter-spacing:.18em;color:var(--rose);padding-left:.18em}
.letter .head .ln{width:38px;height:1px;background:var(--gold);margin:8px auto 0}
.paper{position:relative;width:min(82vw,350px);background:var(--paper);padding:clamp(18px,4.6vw,26px) clamp(18px,5vw,26px) clamp(14px,4vw,20px);box-shadow:0 16px 34px rgba(150,100,120,.2);transform:rotate(-.8deg)}
.paper::before{content:"";position:absolute;inset:6px;border:1px solid rgba(212,160,122,.34);pointer-events:none}
.paper .tape{position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);width:48px;height:16px;background:rgba(232,190,170,.6)}
.paper .hi{font:400 clamp(12px,3.4vw,14px) var(--serif);color:var(--rose);margin-bottom:8px}
.paper p{font:400 clamp(11px,3vw,13px)/1.72 var(--serif);color:#78565f;text-align:justify;margin-bottom:6px}
.paper .sign{text-align:right;font:400 12px var(--serif);color:var(--rose);margin-top:7px;letter-spacing:.1em}

/* 结尾 */
.finale .seal{width:min(38vw,150px);height:min(38vw,150px);border-radius:50%;border:1px solid rgba(212,160,122,.5);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:5vh}
.finale .seal::before{content:"";position:absolute;inset:9px;border-radius:50%;border:1px dashed rgba(212,160,122,.4)}
.finale .seal svg{width:46%;height:auto}
.finale h2{font:400 clamp(26px,7.5vw,34px) var(--serif);letter-spacing:.1em;color:var(--ink);padding-left:.1em;white-space:nowrap}
.finale .wish{font:400 clamp(14px,4vw,17px) var(--serif);color:var(--rose);letter-spacing:.14em;margin-top:18px;padding-left:.14em;white-space:nowrap}
.finale .sm{font:400 9px Georgia,serif;letter-spacing:.26em;color:#bd98a0;margin-top:6vh;padding-left:.26em}

@media (max-height:640px){
  .page{padding:6vh 7vw}
  .letter{padding:3vh 6vw}
  .paper p{line-height:1.6;font-size:clamp(10px,2.9vw,12px)}
  .yearpg .yr{font-size:clamp(42px,12vw,56px)}
}
@media (prefers-reduced-motion:reduce){
  .petal,.g1,.g2,.g3,.hint i{animation:none}
  .anim{transition:none;opacity:1;transform:none}
}
</style>
</head>
<body>

<audio id="music" src="music.m4a" loop preload="none" playsinline webkit-playsinline></audio>

<div class="progress" id="progress"></div>
<div class="counter" id="counter">01 / 16</div>
<div class="music-btn tip" id="musicBtn" role="button" aria-label="背景音乐">
  <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
</div>
<div class="dots" id="dots"></div>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="deck" id="deck">
  <!-- 页面由脚本生成 -->
</div>

<script>
(function(){
  /* ===== Canvas 光尘渲染：暖金微粒缓缓上浮 + 柔光团流动 ===== */
  (function(){
    var cv=document.getElementById('fx');
    if(!cv||!cv.getContext) return;
    var ctx=cv.getContext('2d'), W=0, H=0, dpr=1, motes=[], glows=[], raf=null, last=0;
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    var tint=['rgba(212,160,122,','rgba(232,190,170,','rgba(255,214,190,','rgba(240,170,190,'];

    function size(){
      dpr=Math.min(window.devicePixelRatio||1,2);
      W=window.innerWidth; H=window.innerHeight;
      cv.width=W*dpr; cv.height=H*dpr;
      cv.style.width=W+'px'; cv.style.height=H+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      build();
    }
    function build(){
      var count=Math.min(70,Math.round(W*H/14000));
      motes=[];
      for(var i=0;i<count;i++){
        motes.push({
          x:Math.random()*W, y:Math.random()*H,
          r:.6+Math.random()*1.9,
          sp:.10+Math.random()*.32,
          drift:(Math.random()-.5)*.18,
          ph:Math.random()*Math.PI*2,
          tw:.008+Math.random()*.022,
          c:tint[(Math.random()*tint.length)|0],
          a:.22+Math.random()*.42
        });
      }
      glows=[
        {x:.18,y:.22,r:.42,c:'rgba(255,205,168,',a:.055,sp:.00009,ph:0},
        {x:.82,y:.68,r:.5,c:'rgba(244,178,196,',a:.05,sp:.00007,ph:2},
        {x:.5,y:.9,r:.38,c:'rgba(255,222,186,',a:.045,sp:.00011,ph:4}
      ];
    }
    function glow(g,t){
      var cx=(g.x+Math.sin(t*g.sp+g.ph)*.06)*W;
      var cy=(g.y+Math.cos(t*g.sp*.8+g.ph)*.05)*H;
      var rad=g.r*Math.max(W,H)*(1+Math.sin(t*g.sp*1.5+g.ph)*.06);
      var gr=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
      gr.addColorStop(0,g.c+g.a+')');
      gr.addColorStop(.55,g.c+(g.a*.4)+')');
      gr.addColorStop(1,g.c+'0)');
      ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
    }
    function frame(now){
      raf=requestAnimationFrame(frame);
      if(now-last<16) return;
      last=now;
      ctx.clearRect(0,0,W,H);
      for(var k=0;k<glows.length;k++) glow(glows[k],now);
      for(var i=0;i<motes.length;i++){
        var m=motes[i];
        if(!reduced){ m.y-=m.sp; m.x+=m.drift; m.ph+=m.tw; }
        if(m.y<-12){ m.y=H+12; m.x=Math.random()*W; }
        if(m.x<-12) m.x=W+12; else if(m.x>W+12) m.x=-12;
        var a=m.a*(.55+.45*Math.sin(m.ph));
        var r=m.r;
        var gr=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,r*3.2);
        gr.addColorStop(0,m.c+a+')');
        gr.addColorStop(.4,m.c+(a*.5)+')');
        gr.addColorStop(1,m.c+'0)');
        ctx.fillStyle=gr;
        ctx.beginPath(); ctx.arc(m.x,m.y,r*3.2,0,Math.PI*2); ctx.fill();
      }
    }
    size();
    window.addEventListener('resize',size);
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){ if(raf){cancelAnimationFrame(raf);raf=null;} }
      else if(!raf){ last=0; raf=requestAnimationFrame(frame); }
    });
    raf=requestAnimationFrame(frame);
  })();

  /* ===== 数据配置：每年一页，照片按年份命名 ===== */
  var YEARS = [
    {year:2014, title:'我们在一起了', sub:'从这天起，身边的人就定了', love:'我爱你', lp:'lp1', photos:['2014.jpg']},
    {year:2015, title:'第二年',        sub:'日子越过越有你的样子',   love:'Je t’aime', lp:'lp2', photos:['2015.jpg']},
    {year:2016, title:'一起走过',      sub:'',                        love:'愛してる', lp:'lp5', photos:['2016.jpg']},
    {year:2017, title:'那些日常',      sub:'',                        love:'사랑해', lp:'lp6', photos:['2017-01.jpg','2017-02.jpg']},
    {year:2018, title:'又一年',        sub:'',                        love:'Ich liebe dich', lp:'lp9', photos:['2018.jpg']},
    {year:2019, title:'上海迪士尼',    sub:'',                        love:'Te amo', lp:'lp10', photos:['2019-01.jpg','2019-02.jpg','2019-03.jpg']},
    {year:2020, title:'我向你求婚了',  sub:'那束玫瑰，和那句「嫁给我」', love:'Ti amo', lp:'lp11', photos:['2020-1.jpg','2020-2.jpg','2020-3.jpg']},
    {year:2021, title:'我们结婚了',    sub:'',                        love:'Я тебя люблю', lp:'lp13', photos:['2021-01.jpg','2021-02.jpg']},
    {year:2022, title:'儿子来了',      sub:'家里多了个小小的你',     love:'I love you', lp:'lp4', photos:['2022.jpg']},
    {year:2023, title:'三口之家',      sub:'',                        love:'ฉันรักเธอ', lp:'lp14', photos:['2023.jpg']},
    {year:2024, title:'慢慢长大',      sub:'',                        love:'Eu te amo', lp:'lp16', photos:['2024.jpg']},
    {year:2025, title:'女儿来了',      sub:'从此，一家四口',          love:'أحبك', lp:'lp12', photos:['2025-01.jpg','2025-02.jpg','2025-03.jpg']},
    {year:2026, title:'今年',          sub:'故事还在继续',            love:'Seni seviyorum', lp:'lp15', photos:['2026.jpg']}
  ];

  /* 每页的入场方式：yr=年份, pic=照片, cap=标题；不同页用不同组合 */
  var ENTER = {
    2:{yr:'yrDrop',pic:'eLeft'},   3:{yr:'yrSlide',pic:'eRight'},
    4:{yr:'yrZoom',pic:'eFlip'},   5:{yr:'yrDrop',pic:'eCard'},
    6:{yr:'yrSlide',pic:'eRise'},  7:{yr:'yrZoom',pic:'eRight'},
    8:{yr:'yrDrop',pic:'ePop'},    9:{yr:'yrSlide',pic:'eLeft'},
    10:{yr:'yrZoom',pic:'eCorner'},11:{yr:'yrDrop',pic:'eFlip'},
    12:{yr:'yrSlide',pic:'eRise'}, 13:{yr:'yrZoom',pic:'ePop'},
    14:{yr:'yrDrop',pic:'eCorner'}
  };
  function bg(){ return '<div class="bg"><span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span><span class="petals"></span></div>'; }
  function photoSlot(file, cls, ent){
    return '<div class="card '+(cls||'')+' anim pop" style="--pic:'+(ent||'eUp')+'"><div class="photo"><img src="photos/'+file+'" alt="" loading="lazy"></div></div>';
  }
  function yearPage(item, pg){
    var n = item.photos.length;
    var layout = n===1 ? 'y1' : (n===2 ? 'y2' : 'y3');
    var E = ENTER[pg];
    var imgs = '';
    if(n===1){
      imgs = '<div class="solo anim pop" style="--pic:'+E.pic+'"><div class="photo" style="height:100%"><img src="photos/'+item.photos[0]+'" alt="" loading="lazy"></div></div>';
    } else if(n===2){
      imgs = '<div class="duo">'+photoSlot(item.photos[0],'a',E.pic)+photoSlot(item.photos[1],'b','eRise')+'</div>';
    } else {
      imgs = '<div class="grid3">'+photoSlot(item.photos[0],'big',E.pic)
             + photoSlot(item.photos[1],'','eCard')+photoSlot(item.photos[2],'','eFlip')+'</div>';
    }
    return '<section class="page yearpg pg'+pg+' '+layout+'">'+bg()
      + '<div class="love '+item.lp+' anim" style="--d:.85s">'+item.love+'</div>'
      + '<div class="yr anim" style="--yr:'+E.yr+';--d:.06s">'+item.year+'</div>'
      + imgs
      + '<div class="cap anim" style="--d:.5s"><div class="ttl">'+item.title+'</div>'
      + (item.sub?'<div class="sub">'+item.sub+'</div>':'')+'</div></section>';
  }

  var html = '';
  /* 封面 */
  html += '<section class="page cover pg1">'+bg()
    + '<div class="love lp3 anim" style="--d:.9s">Σ’ αγαπώ</div>'
    + '<div class="en anim" style="--d:.1s">HAPPY BIRTHDAY · MY LOVE</div>'
    + '<div class="ico anim cover-3d" style="--d:.2s"><div class="ring"><svg width="52" height="52" viewBox="0 0 44 44" fill="none">'
    + '<circle cx="22" cy="22" r="19" stroke="#d4a07a" stroke-width=".6" opacity=".55"/>'
    + '<circle cx="22" cy="22" r="15" stroke="#d4a07a" stroke-width=".5" stroke-dasharray="2 3" opacity=".5"/>'
    + '<path d="M22 28c-5-3.5-8-6-8-9a4.2 4.2 0 0 1 8-1.6A4.2 4.2 0 0 1 30 19c0 3-3 5.5-8 9z" fill="#c07f8f"/></svg></div></div></div>'
    + '<h1 class="anim pop" style="--d:.32s">生日快乐</h1>'
    + '<div class="who anim" style="--d:.44s">我最爱的人</div>'
    + '<div class="date anim" style="--d:.56s">11 · 24</div>'
    + '<div class="hint anim" style="--d:.8s">向上滑动<i></i></div></section>';

  /* 年份页 */
  YEARS.forEach(function(it,i){ html += yearPage(it, i+2); });

  /* 信 */
  html += '<section class="page letter pg15">'+bg()
    + '<div class="love lp7 anim" style="--d:.9s">मैं तुमसे प्यार करता हूँ</div>'
    + '<div class="head anim" style="--d:.1s"><h2>写给你的话</h2><div class="ln"></div></div>'
    + '<div class="paper anim pop" style="--d:.24s"><div class="tape"></div>'
    + '<div class="hi">老婆，生日快乐。</div>'
    + '<p>从二〇一四年到今天，一晃十二年。翻看这些照片，当年只有我们两个人，后来迎来第一个孩子，再到现在一家四口。这十二年，算不上一路坦途，争吵、别扭、不如意，全都有。生活里源源不断的琐事，养育孩子的重担，偶尔的误解和情绪，都曾让我们陷入疲惫。我们也会有对彼此失望的时候，会有话说不到一块、谁也不肯让步的时刻。</p>'
    + '<p>可就算有这么多不完美，我们还是一起走到了现在。没有轰轰烈烈，大多都是平淡琐碎的日常，吵归吵，日子依旧一起过，难关依旧一起扛。于我而言，所有的欢喜和摩擦加在一起，这个有你的家，才是我最想好好守住的生活。</p>'
    + '<div class="sign">爱你的我</div></div></section>';

  /* 结尾 */
  html += '<section class="page finale pg16">'+bg()
    + '<div class="love lp8 anim" style="--d:.9s">Ik hou van je</div>'
    + '<div class="seal anim pop" style="--d:.16s"><svg viewBox="0 0 44 44" fill="none">'
    + '<path d="M22 30c-6-4.2-10-7.5-10-11.5A5.4 5.4 0 0 1 22 15a5.4 5.4 0 0 1 10 3.5C32 22.5 28 25.8 22 30z" fill="#c07f8f" opacity=".9"/></svg></div>'
    + '<h2 class="anim" style="--d:.3s">生日快乐</h2>'
    + '<div class="wish anim" style="--d:.42s">往后的每一年，都在你身边</div>'
    + '<div class="sm anim" style="--d:.6s">FOREVER &amp; ALWAYS</div></section>';

  document.getElementById('deck').innerHTML = html;

  /* 花瓣 */
  var colors=['rgba(232,150,170,.55)','rgba(212,160,122,.5)','rgba(240,175,192,.5)','rgba(255,205,170,.45)'];
  document.querySelectorAll('.petals').forEach(function(layer){
    for(var i=0;i<12;i++){
      var p=document.createElement('span'); p.className='petal';
      var size=6+Math.random()*8;
      p.style.width=size+'px'; p.style.height=size+'px';
      p.style.left=(Math.random()*100)+'%';
      p.style.background=colors[i%colors.length];
      p.style.animationDuration=(11+Math.random()*9)+'s';
      p.style.animationDelay=(-Math.random()*18)+'s';
      p.style.setProperty('--dx',(40+Math.random()*90)+'px');
      p.style.setProperty('--rot',(220+Math.random()*260)+'deg');
      layer.appendChild(p);
    }
  });

  /* 图片加载完成淡入 */
  document.querySelectorAll('.photo img').forEach(function(img){
    function done(){ img.classList.add('loaded'); }
    if(img.complete) done(); else img.addEventListener('load', done);
  });

  /* 背景音乐：状态只认音频的真实事件，不认 play() 调用结果 */
  var music=document.getElementById('music'), musicBtn=document.getElementById('musicBtn');
  var userToggled=false, gestureBound=true;

  function reallyPlaying(){
    return !music.paused && music.currentTime > 0;
  }
  function refreshBtn(){
    var on=reallyPlaying();
    musicBtn.classList.toggle('playing',on);
    if(on) musicBtn.classList.remove('tip');
  }
  function doPlay(){
    if(userToggled) return;
    var p=music.play();
    if(p && p.catch) p.catch(function(){});  /* 失败就等着,不假装成功 */
  }
  function tryPlay(){
    if(userToggled || reallyPlaying()) return;
    doPlay();
  }
  /* 按钮:完全按真实状态切换——正在响就暂停,没响就播放 */
  musicBtn.addEventListener('click',function(e){
    e.stopPropagation();
    userToggled=true;
    if(reallyPlaying()){ music.pause(); }
    else { var p=music.play(); if(p&&p.catch) p.catch(function(){}); }
    setTimeout(refreshBtn,50);
  });

  /* 微信环境就绪后尝试 */
  function wxReady(){
    if(window.WeixinJSBridge && WeixinJSBridge.invoke){
      WeixinJSBridge.invoke('getNetworkType',{},function(){ doPlay(); });
    }
  }
  if(window.WeixinJSBridge) wxReady();
  else document.addEventListener('WeixinJSBridgeReady',wxReady,false);

  /* 每次手势都再试;真播起来后 refreshing 会自动摘掉监听 */
  document.addEventListener('touchstart',tryPlay,true);
  document.addEventListener('touchend',tryPlay,true);
  document.addEventListener('click',tryPlay,true);

  /* 只有音频真的开始播放,才认、才停掉手势监听 */
  music.addEventListener('playing',function(){
    musicBtn.classList.add('playing');
    musicBtn.classList.remove('tip');
    if(gestureBound){
      document.removeEventListener('touchstart',tryPlay,true);
      document.removeEventListener('touchend',tryPlay,true);
      document.removeEventListener('click',tryPlay,true);
      gestureBound=false;
    }
  });
  music.addEventListener('pause',refreshBtn);
  music.addEventListener('timeupdate',function(){ if(music.currentTime>0) musicBtn.classList.remove('tip'); });

  /* 页面空闲后在后台预缓冲:首屏不等它,但用户触碰时已经加载好,一点就响 */
  function preloadAudio(){
    if(music.readyState>=2) return;
    var src=music.getAttribute('src');
    music.setAttribute('src',src);  /* 触发加载,不播放 */
    music.load();
  }
  if(window.addEventListener) window.addEventListener('load',function(){ setTimeout(preloadAudio,300); },false);

  /* 翻页：进度、页码、圆点、入场动画 */
  var deck=document.getElementById('deck');
  var pages=Array.prototype.slice.call(deck.querySelectorAll('.page'));
  var progress=document.getElementById('progress'), counter=document.getElementById('counter');
  var dotsBox=document.getElementById('dots');
  pages.forEach(function(){ dotsBox.appendChild(document.createElement('i')); });
  var dots=Array.prototype.slice.call(dotsBox.children), current=-1;
  function activate(idx){
    if(idx===current) return;
    current=idx;
    pages.forEach(function(p,i){ p.classList.toggle('in',i===idx); });
    dots.forEach(function(d,i){ d.classList.toggle('on',i===idx); });
    counter.textContent=String(idx+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');
  }
  function onScroll(){
    var max=deck.scrollHeight-deck.clientHeight;
    progress.style.width=(max>0?(deck.scrollTop/max*100):0)+'%';
    var idx=Math.max(0,Math.min(pages.length-1,Math.round(deck.scrollTop/deck.clientHeight)));
    activate(idx);
  }
  deck.addEventListener('scroll',onScroll,{passive:true});
  dots.forEach(function(d,i){ d.addEventListener('click',function(){ pages[i].scrollIntoView({behavior:'smooth'}); }); });
  activate(0); onScroll();
})();
</script>
</body>
</html>
